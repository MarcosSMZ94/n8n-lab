# Ubuntu/Debian de laboratório: /etc/ssh/sshd_config.d/00-ares-lab.conf
# Validar a chave do usuário em uma SEGUNDA sessão antes de recarregar.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
