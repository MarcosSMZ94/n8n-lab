name: ares-n8n-lab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    restart: unless-stopped
    user: "${PROXY_UID:-0}:${PROXY_GID:-0}"
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command:
      - --api.dashboard=false
      - --global.sendanonymoususage=false
      - --global.checknewversion=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:8080
      - --entrypoints.websecure.address=:8443
      - --entrypoints.hooks.address=:9443
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --entrypoints.hooks.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedpercent=false
      - --entrypoints.hooks.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.hooks.http.encodedcharacters.allowencodedpercent=false
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=60s
      - --entrypoints.hooks.transport.respondingtimeouts.readtimeout=60s
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --log.level=INFO
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${WEB_PORT:-18080}:8080"
      - "${ADMIN_BIND:-127.0.0.1}:${TLS_PORT:-18443}:8443"
      - "${HOOK_BIND:-127.0.0.1}:${HOOK_PORT:-19443}:9443"
    volumes:
      - ./.local/dynamic:/etc/traefik/dynamic:ro
      - ./.local/tls:/certs:ro
      - ./.local/secrets/proxy.users:/run/secrets/proxy.users:ro
    networks: [proxy]
    logging: *logging

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Execute scripts/lab.py init}
      N8N_APP_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/lab.py init}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres17-data:/var/lib/postgresql/data
      - ./postgres/init-app-db.sh:/docker-entrypoint-initdb.d/01-app-db.sh:ro
    networks: [database]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.6@sha256:526daa38b68e923cc00c5280d18b4da5d489f115a73bdbf3b8e452b184197a9a
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1536m
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/lab.py init}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Execute scripts/lab.py init}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${EDITOR_URL:-https://localhost:18443/}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-https://localhost:19443/}
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      N8N_SAMESITE_COOKIE: lax
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: owner@example.invalid
      N8N_INSTANCE_OWNER_FIRST_NAME: Lab
      N8N_INSTANCE_OWNER_LAST_NAME: Ares
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?Execute scripts/lab.py init}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/allowed-files
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN:?Execute scripts/lab.py init}
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.readWriteFile","n8n-nodes-base.readBinaryFile","n8n-nodes-base.readBinaryFiles","n8n-nodes-base.writeBinaryFile","n8n-nodes-base.readPdf","n8n-nodes-base.ssh","n8n-nodes-base.ftp","n8n-nodes-base.code","n8n-nodes-base.function","n8n-nodes-base.functionItem"]'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [proxy, database]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30
    logging: *logging

networks:
  proxy:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  n8n-data:
  postgres17-data:
